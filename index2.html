<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athul Pious Saneesh | Computer Science Student</title>
<meta name="description" content="Portfolio of Athul Pious Saneesh, a Computer Science and Engineering student focused on web development and programming.">
<style>
:root{
  --bg:#ffffff; --surface:#f5f7fa; --text:#1f2933; --muted:#52606d;
  --line:#d9e0e7; --accent:#1d4e89; --accent-hover:#143a69;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#10161d; --surface:#18212b; --text:#e6ebf0; --muted:#a3afbb;
        --line:#2b3745; --accent:#7fb2ea; --accent-hover:#a8cbf2;}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;font-size:1rem}
a{color:var(--accent)}
a:hover{color:var(--accent-hover)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 1.25rem}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
nav{display:flex;justify-content:space-between;align-items:center;min-height:56px;gap:1rem;flex-wrap:wrap}
.brand{font-weight:700;color:var(--text);text-decoration:none}
nav ul{display:flex;gap:1.25rem;list-style:none;margin:0;padding:0}
nav ul a{color:var(--muted);text-decoration:none;font-size:.95rem}
nav ul a:hover{color:var(--accent)}
.hero{padding:4rem 0 3rem;display:grid;grid-template-columns:1fr 180px;gap:2.5rem;align-items:center}
.hero img{width:180px;height:180px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
h1{font-size:2.25rem;line-height:1.2;margin:0 0 .35rem}
.role{color:var(--accent);font-weight:600;margin:0 0 1rem}
.hero p{max-width:60ch;color:var(--muted);margin:0 0 1.5rem}
.btns{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.6rem 1.1rem;border-radius:6px;font-weight:600;text-decoration:none;border:1px solid var(--accent)}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.primary:hover{background:var(--accent-hover);color:var(--bg)}
